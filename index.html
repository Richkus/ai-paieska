<!doctype html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>AI paieška: prototipas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400..800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/shell.css?v=1022p">
<link rel="stylesheet" href="assets/css/search.css?v=1022p">
<link rel="stylesheet" href="assets/css/filters.css?v=1022p">
<link rel="stylesheet" href="assets/css/search-v2.css?v=1022p">
<link rel="stylesheet" href="assets/css/loader.css?v=1022p">
<link rel="stylesheet" href="assets/css/admin.css?v=1022p">
<script defer src="https://cdn.jsdelivr.net/npm/@alpinejs/collapse@3.14.1/dist/cdn.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
</head>
<body>
<!--
  AI paieškos prototipas. Visos versijos viename puslapyje,
  perjungiama per Admin (apačioje kairėje) arba ?v=2 / ?v=4.

  Nauja versija:
   1. VERSIONS sąraše (apačioje, JS) pridėk { id, label, desc, params }.
   2. Markup'e pridėk bloką su ver === 'vN'.
   3. params: version-specifiniai admin nustatymai, pasiekiami per p.<key>.
-->
<div class="ms-app" x-data="search()" @popstate.window="onPop($event)" @keydown.escape.window="closePanel(); pvClose()" @scroll.window.passive="pv.id && pvClose()">
  <aside class="ms-sidebar" data-shell="sidebar"></aside>

  <div class="ms-main">
    <header class="ms-topbar" data-shell="topbar"></header>

    <main class="ms-content">
      <!-- Pradinė būsena: žmogus dar nieko neieškojo (low-fi „Naujausi“) -->
      <div class="home" x-show="phase === 'start'">
        <div class="home-tip">
          <svg width="18" height="18" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.5c.4 3.3 3.2 6.1 6.5 6.5-3.3.4-6.1 3.2-6.5 6.5-.4-3.3-3.2-6.1-6.5-6.5 3.3-.4 6.1-3.2 6.5-6.5Z" fill="currentColor"/></svg>
          <div>
            <strong>Paieškoje galit klausti savais žodžiais</strong>
            <span>Pvz. „Darbuotojas dirbo šeštadienį, ar galiu jam duoti laisvą dieną?“ Padėsim rasti tinkamą medžiagą.</span>
          </div>
          <button type="button" @click="$refs.search.focus()">Išbandyti</button>
        </div>
        <h1>Naujausi</h1>
        <div class="home-grid" aria-hidden="true">
          <template x-for="i in 6" :key="i"><div class="home-card"><i></i><b></b><b></b><b class="is-short"></b></div></template>
        </div>
      </div>

      <div x-show="phase !== 'start'" :class="{ 'v2': true, 'is-classic': mode === 'classic', 'is-loading': phase === 'loading', 'is-busy': !!busy }">
      <div class="v2-main">

        <!-- V4, plati tema: kryptys iškart po paieškos lauku (kaip Google „Refine“), paspaudus perrašomas klausimas lauke -->
        <div class="rf" x-show="ver === 'v4' && ai.kind === 'directions'" x-cloak>
          <p class="rf-q" x-text="ai.lead || ai.heading"></p>
          <div class="rf-chips">
            <template x-for="(d, i) in ai.directions" :key="d.label">
              <button type="button" class="rf-chip" @click="follow(related[i] || d.label)" :title="related[i] || ''"><span x-text="d.label"></span><em x-text="d.count"></em></button>
            </template>
          </div>
        </div>

        <!-- V4: trys tab'ai kaip Google (DI režimas · Viskas · Rezultatų sąrašas) -->
        <div class="sr-modes" x-show="ver === 'v4'" role="tablist" aria-label="Paieškos režimas">
          <button type="button" role="tab" :class="{ 'is-on': mode === 'ai' && aiOnly }" :aria-selected="mode === 'ai' && aiOnly" @click="setMode('ai', true)">
            <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.5c.4 3.3 3.2 6.1 6.5 6.5-3.3.4-6.1 3.2-6.5 6.5-.4-3.3-3.2-6.1-6.5-6.5 3.3-.4 6.1-3.2 6.5-6.5Z" fill="currentColor"/></svg>
            DI režimas
          </button>
          <button type="button" role="tab" :class="{ 'is-on': mode === 'ai' && !aiOnly }" :aria-selected="mode === 'ai' && !aiOnly" @click="setMode('ai')">Viskas</button>
          <button type="button" role="tab" :class="{ 'is-on': mode === 'classic' }" :aria-selected="mode === 'classic'" @click="setMode('classic')">Rezultatų sąrašas</button>
        </div>

        <!-- Režimai (V2) -->
        <div class="sr-modes" x-show="ver === 'v2'" role="tablist" aria-label="Paieškos režimas">
          <button type="button" role="tab" :class="{ 'is-on': mode === 'ai' }" :aria-selected="mode === 'ai'" @click="setMode('ai')">
            <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.5c.4 3.3 3.2 6.1 6.5 6.5-3.3.4-6.1 3.2-6.5 6.5-.4-3.3-3.2-6.1-6.5-6.5 3.3-.4 6.1-3.2 6.5-6.5Z" fill="currentColor"/></svg>
            Atsakymas su AI
          </button>
          <button type="button" role="tab" :class="{ 'is-on': mode === 'classic' }" :aria-selected="mode === 'classic'" @click="setMode('classic')">Tik rezultatai</button>
        </div>

        <!-- Įkėlimas po paieškos -->
        <div class="sk" x-show="phase === 'loading'" x-cloak aria-live="polite">
          <p class="sk-label"><span x-html="LOADER(p.loader || 'morph', 18, +(p.dots || 7))"></span> Ieškom SUFLERIO medžiagoje…</p>
          <i style="width:55%;height:20px"></i><i style="width:92%"></i><i style="width:80%"></i><i style="width:88%"></i><i style="width:40%"></i>
        </div>

        <!-- ===== V2 · AI blokas be dėžučių ===== -->
        <template x-if="mode === 'ai' && !(ver === 'v4' && ['low', 'directions'].includes(ai.kind))">
          <section class="a2" :class="{ 'is-card': ver === 'v4' && p.aiStyle !== 'plain', 'is-plain': ver === 'v4' && p.aiStyle === 'plain' }" aria-live="polite">
            <!-- Į ką ką tik atsakėt: lieka matoma, kad būtų aišku, kodėl pasikeitė -->
            <div class="a2-answered" x-show="lastAnswer && ver === 'v2'" x-cloak :title="lastAnswer && lastAnswer.q">
              <span x-text="busy ? 'Tikslinam pagal jūsų atsakymą' : 'Patikslinta pagal jūsų atsakymą'"></span>
              <span class="a2-ans">
                <span x-text="lastAnswer && lastAnswer.a"></span>
                <button type="button" :hidden="!!busy" @click="goStep(step - 1)" aria-label="Atšaukti patikslinimą" title="Atšaukti patikslinimą">×</button>
              </span>
              <span class="a2-delta" x-show="!busy && lastAnswer && lastAnswer.from" x-text="!busy && lastAnswer && lastAnswer.from ? lastAnswer.from + ' → ' + lastAnswer.to + ' ' + rezultatai(lastAnswer.to) : ''"></span>
            </div>

            <div class="sk is-inline" x-show="busy" x-cloak>
              <p class="sk-label"><span x-html="LOADER(p.loader || 'morph', 18, +(p.dots || 7))"></span> Ieškom pagal jūsų atsakymą…</p>
              <i style="width:50%;height:20px"></i><i style="width:90%"></i><i style="width:76%"></i><i style="width:84%"></i>
            </div>

            <div x-show="!busy" x-effect="sc.id; step; $el.classList.remove('ai-swap'); void $el.offsetWidth; $el.classList.add('ai-swap')">
            <div class="a2-head" :class="{ 'is-label': ver === 'v4', 'is-ask': ver === 'v4' && ai.kind !== 'quotes' }">
              <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.5c.4 3.3 3.2 6.1 6.5 6.5-3.3.4-6.1 3.2-6.5 6.5-.4-3.3-3.2-6.1-6.5-6.5 3.3-.4 6.1-3.2 6.5-6.5Z" fill="currentColor"/></svg>
              <h2 x-show="ver !== 'v4'" x-text="ai.heading"></h2>
              <span class="a2-label" x-show="ver === 'v4'" x-text="ai.kind === 'quotes' ? 'DI atrinktos ištraukos iš panašių situacijų' : ai.heading"></span>
              <button type="button" class="a2-info" @mouseenter="tip = true" @mouseleave="tip = false" @focus="tip = true" @blur="tip = false" aria-label="Kaip tai veikia">
                <svg width="15" height="15" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.5" stroke="currentColor" stroke-width="1.3" fill="none"/><path d="M8 7.2v4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><circle cx="8" cy="5" r=".9" fill="currentColor"/></svg>
                <span class="a2-tip" x-show="tip" x-cloak x-transition.opacity.duration.120ms>Rodom tik ištraukas iš SUFLERIO medžiagos. Išvadų nedarom, sprendimą priimat jūs.</span>
              </button>
            </div>

            <template x-if="ai.kind === 'quotes'">
              <ul class="a2-quotes">
                <template x-for="qt in ai.quotes" :key="qt.id">
                  <li class="a2-quote">
                    <p x-show="ver !== 'v4'" x-text="'„' + R[qt.id].quote + '“'"></p>
                    <!-- V4: šaltinis mažu žetonu teksto gale (kaip Perplexity / Google); pilnas pavadinimas užvedus pelę -->
                    <p x-show="ver === 'v4'"><span x-text="'„' + R[qt.id].quote + '“'"></span>
                      <button type="button" class="a2-cite" :class="{ 'is-pro': R[qt.id].pro }" @click="pvClose(); openPanel(qt.id, true)" @mouseenter="pvEnter(qt.id, $el)" @mouseleave="pvLeave()" @focus="pvEnter(qt.id, $el)" @blur="pvLeave()" :aria-label="R[qt.id].type + ': ' + R[qt.id].title"><span x-text="R[qt.id].type"></span></button>
                    </p>
                    <button type="button" class="a2-src" x-show="ver !== 'v4'" @click="pvClose(); openPanel(qt.id, true)" @mouseenter="pvEnter(qt.id, $el)" @mouseleave="pvLeave()" @focus="pvEnter(qt.id, $el)" @blur="pvLeave()">
                      <i class="a2-pro" x-show="R[qt.id].pro">PRO</i>
                      <b x-text="R[qt.id].type"></b><span x-text="'· ' + R[qt.id].title"></span>
                    </button>
                  </li>
                </template>
              </ul>
            </template>

            <!-- V4: nieko neradus, kelias į ekspertą su jau įrašytu klausimu -->
            <template x-if="ver === 'v4' && ai.kind === 'empty'">
              <div class="a2-empty">
                <p class="a2-rel-sub">Užduokit klausimą ekspertui, jis atsakys asmeniškai.</p>
                <button type="button" class="ex-btn" @click="openAsk()">Klausti eksperto</button>
              </div>
            </template>

            <div class="a2-foot">
              <div x-show="ver === 'v4'">
                <div x-show="related.length">
                  <p class="a2-rel-h" x-show="ai.kind === 'quotes'">Tęskit temą</p>
                  <p class="a2-rel-sub" x-show="ai.kind === 'directions'">Pasirinkit kryptį, ieškosim konkrečiau</p>
                  <p class="a2-rel-h" x-show="ai.kind === 'empty'">Arba ieškokit plačiau</p>
                  <ul class="a2-list">
                    <template x-for="r in related" :key="r">
                      <li><button type="button" class="a2-row" @click="follow(r)"><i aria-hidden="true">↳</i><span x-text="r"></span></button></li>
                    </template>
                  </ul>
                </div>
              </div>
              <div x-show="ver !== 'v4'">
                <div x-show="answers.length">
                    <p class="a2-ask" x-show="askText" x-text="askText"></p>
                    <ul class="a2-list" x-show="!other && p.answers === 'list'">
                      <template x-for="a in answers" :key="a.label">
                        <li><button type="button" class="a2-row" @click="refine(a.label)" :title="a.hint || ''"><i aria-hidden="true">↳</i><span x-text="a.label"></span><em x-show="a.count" x-text="a.count"></em></button></li>
                      </template>
                      <li x-show="ai.kind !== 'empty'"><button type="button" class="a2-row is-other" @click="openOther()"><i aria-hidden="true">↳</i><span>Kita, parašysiu pats…</span></button></li>
                    </ul>
                    <div class="a2-answers" x-show="!other && p.answers !== 'list'">
                      <template x-for="a in answers" :key="a.label">
                        <button type="button" class="a2-chip" @click="refine(a.label)" :title="a.hint || ''"><span x-text="a.label"></span><em x-show="a.count" x-text="a.count"></em></button>
                      </template>
                      <button type="button" class="a2-chip is-other" x-show="ai.kind !== 'empty'" @click="openOther()">Kita…</button>
                    </div>
                    <form class="a2-other" x-show="other" x-cloak @submit.prevent="refine(own)">
                      <label class="a2-other-field">
                        <input type="text" x-ref="other" x-model="own" placeholder="Jūsų atsakymas…" aria-label="Jūsų atsakymas" @keydown.escape.stop="other = false; own = ''">
                        <button type="submit" :disabled="!own.trim()" aria-label="Atsakyti">
                          <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M2 7h10M8 3l4 4-4 4" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
                        </button>
                      </label>
                      <button type="button" class="a2-cancel" @click="other = false; own = ''">Atšaukti</button>
                    </form>
                </div>
                <p class="a2-hint" x-show="!answers.length">Ne tai? Pakeiskit klausimą paieškos lauke viršuje.</p>
              </div>
              <div class="a2-votes">
                <button type="button" class="a2-askex" x-show="ver === 'v4' && ai.kind === 'quotes'" @click="openAsk()">Neradot atsakymo? Klauskit eksperto</button>
                <button type="button" class="a2-vote" :class="{ 'is-on': vote === 1 }" @click="vote = vote === 1 ? 0 : 1" aria-label="Padėjo" title="Padėjo">
                  <svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><path d="M5 7v7H2V7h3Zm0 0 3-5.5c1 0 1.8.8 1.6 1.8L9.2 6H13a1.5 1.5 0 0 1 1.5 1.8l-1 5A1.5 1.5 0 0 1 12 14H5" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>
                </button>
                <button type="button" class="a2-vote" :class="{ 'is-on': vote === -1 }" @click="vote = vote === -1 ? 0 : -1" aria-label="Nepadėjo" title="Nepadėjo">
                  <svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true" style="transform:scaleY(-1)"><path d="M5 7v7H2V7h3Zm0 0 3-5.5c1 0 1.8.8 1.6 1.8L9.2 6H13a1.5 1.5 0 0 1 1.5 1.8l-1 5A1.5 1.5 0 0 1 12 14H5" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>
                </button>
              </div>
            </div>
            </div>
          </section>
        </template>

        <!-- V4, mažas panašumas: DI bloko nerodom, tik paaiškinimą ir kelią į ekspertą -->
        <template x-if="mode === 'ai' && ver === 'v4' && ai.kind === 'low'">
          <div class="lowc">
            <div class="lowc-row">
              <svg width="18" height="18" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.5" stroke="currentColor" stroke-width="1.3" fill="none"/><path d="M8 7.2v4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><circle cx="8" cy="5" r=".9" fill="currentColor"/></svg>
              <p><b>Tiksliai panašių situacijų neradom.</b> <span x-text="aiOnly ? 'Kad nesuklaidintume, DI ištraukų nerodom. Peržiūrėkit rezultatų sąrašą arba klauskit eksperto.' : 'Kad nesuklaidintume, DI ištraukų nerodom. Žemiau visi paieškos rezultatai.'"></span></p>
              <button type="button" class="lowc-btn" @click="openAsk()">Klausti eksperto</button>
            </div>
            <button type="button" class="lowc-link" x-show="aiOnly" @click="setMode('classic')">Rodyti rezultatų sąrašą →</button>
          </div>
        </template>

        <!-- Filtrų juosta: veikia abiem režimais. Su AI dalį filtrų pritaiko pati (✦) -->
        <div class="fb" :class="{ 'is-stack': fbStack }" x-show="!hideLinks && (baseList.length || anyFilter)" @keydown.escape.stop="pop = ''">
          <span class="fb-count" :class="{ 'is-flash': flash }" x-html="busy ? 'Atnaujinam…' : countHtml"></span>
          <!-- V2/V4: filtrai suskleisti po vienu mygtuku (admin parametras) -->
          <button type="button" class="fb-toggle" x-show="fbCollapsible && !fbOpen" @click="fbOpen = true" :aria-expanded="fbOpen">
            <svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 4h7M13 4h1M2 12h1M7 12h7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" fill="none"/><circle cx="11" cy="4" r="2" stroke="currentColor" stroke-width="1.5" fill="none"/><circle cx="5" cy="12" r="2" stroke="currentColor" stroke-width="1.5" fill="none"/></svg>
            Filtrai
            <b x-show="activeFilterCount" x-text="activeFilterCount"></b>
          </button>
          <div class="fb-pills" x-show="!fbCollapsible || fbOpen"
               x-transition:enter="fb-anim" x-transition:enter-start="fb-off" x-transition:leave="fb-anim" x-transition:leave-end="fb-off">
          <template x-for="k in FKEYS" :key="k">
            <div class="fb-item" @click.outside="pop === k && (pop = '')">
              <button type="button" class="fb-pill" :class="{ 'is-set': has(k) }" :aria-expanded="pop === k" @click="togglePop(k)" :title="isAi(k) ? 'Pritaikė AI pagal jūsų klausimą' : ''">
                <svg x-show="isAi(k)" class="is-ai" width="12" height="12" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.5c.4 3.3 3.2 6.1 6.5 6.5-3.3.4-6.1 3.2-6.5 6.5-.4-3.3-3.2-6.1-6.5-6.5 3.3-.4 6.1-3.2 6.5-6.5Z" fill="currentColor"/></svg>
                <span x-html="pillText(k)"></span>
                <i class="fb-x" x-show="has(k)" @click.stop="clearKey(k)" role="button" :aria-label="'Nuimti filtrą ' + F[k].label">×</i>
                <svg x-show="!has(k)" class="is-chev" width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path d="M2 3.5l3 3 3-3" stroke="currentColor" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </button>
              <div class="fb-pop" x-show="pop === k" x-cloak x-transition.opacity.duration.120ms>
                <label class="fb-pop-search" x-show="F[k].search">
                  <svg width="13" height="13" viewBox="0 0 18 18" aria-hidden="true"><circle cx="7.5" cy="7.5" r="6" stroke="#8aa3a6" stroke-width="1.8" fill="none"/><path d="M12 12l4.5 4.5" stroke="#8aa3a6" stroke-width="1.8" stroke-linecap="round"/></svg>
                  <input type="text" x-model="popQ" :placeholder="'Ieškoti: ' + F[k].label.toLowerCase()">
                </label>
                <ul class="fb-list">
                  <template x-for="o in popOptions(k)" :key="o.id">
                    <li>
                      <button type="button" class="fb-opt" :class="{ 'is-on': isOn(k, o.id), 'is-zero': !optCount(k, o.id) }" @click="toggle(k, o.id)">
                        <i class="fb-check" :class="{ 'is-radio': F[k].single }"><svg width="10" height="8" viewBox="0 0 12 10" aria-hidden="true"><path d="M1 5l3.2 3.2L11 1.5" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></i>
                        <span x-text="o.label"></span>
                        <small x-text="optCount(k, o.id)"></small>
                      </button>
                    </li>
                  </template>
                </ul>
                <p class="fb-pop-empty" x-show="!popOptions(k).length">Nieko nerasta</p>
                <div class="fb-pop-foot" x-show="has(k)">
                  <button type="button" @click="clearKey(k)">Išvalyti</button>
                </div>
              </div>
            </div>
          </template>
          <button type="button" class="fb-close" x-show="fbCollapsible" @click="fbOpen = false; pop = ''" aria-label="Suskleisti filtrus" title="Suskleisti filtrus">×</button>
          </div>
          <div class="fb-end">
            <button type="button" class="fb-clear" x-show="userFilter" @click="clearAll()">Išvalyti</button>
            <div class="fb-item" @click.outside="pop === 'sort' && (pop = '')">
              <button type="button" class="fb-pill fb-sort" :aria-expanded="pop === 'sort'" @click="togglePop('sort')" title="Rikiuoti" aria-label="Rikiuoti">
                <svg width="13" height="13" viewBox="0 0 16 16" aria-hidden="true"><path d="M5 2.5v11M2.5 11 5 13.5 7.5 11M11 13.5v-11M8.5 5 11 2.5 13.5 5" stroke="currentColor" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
                <span x-text="sort === 'new' ? 'Naujausi' : 'Aktualiausi'"></span>
                <svg class="is-chev" width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path d="M2 3.5l3 3 3-3" stroke="currentColor" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </button>
              <div class="fb-pop is-right" x-show="pop === 'sort'" x-cloak x-transition.opacity.duration.120ms style="width:200px">
                <ul class="fb-list">
                  <template x-for="o in [{ id: 'rel', label: 'Aktualiausi' }, { id: 'new', label: 'Naujausi' }]" :key="o.id">
                    <li><button type="button" class="fb-opt" :class="{ 'is-on': sort === o.id }" @click="sort = o.id; pop = ''"><i class="fb-check is-radio"></i><span x-text="o.label"></span></button></li>
                  </template>
                </ul>
              </div>
            </div>
          </div>
        </div>

        <ul class="sr-list" x-show="!hideLinks">
          <template x-for="id in list" :key="id">
            <li class="sr-item">
              <button type="button" @click="openPanel(id)">

<script src="assets/js/shell.js?v=1022p"></script>
<script src="assets/js/data.js?v=1022p"></script>
<script src="assets/js/loader.js?v=1022p"></script>
<script>
  // Admin parametras: filtrai po vienu mygtuku „Filtrai“ arba visada matomi
  const ANSWERS_PARAM = { key: 'answers', label: 'Atsakymai į patikslinimą', type: 'radio', default: 'list', options: [
    { id: 'list', label: 'Sąrašas ↳ (kaip Perplexity)' },
    { id: 'chips', label: 'Chip\'ai' },
  ] };
  // Admin parametras (V4): kaip atskirti DI dalį nuo paieškos rezultatų
  const AI_STYLE_PARAM = { key: 'aiStyle', label: 'DI dalies išskyrimas', type: 'radio', default: 'card', options: [
    { id: 'card', label: 'Kortelė su fonu' },
    { id: 'plain', label: 'Baltas fonas, ryškus skirtukas' },
  ] };
  const FILTERS_PARAM = { key: 'filters', label: 'Filtrai', type: 'radio', default: 'collapsed', options: [
    { id: 'collapsed', label: 'Suskleisti po mygtuku „Filtrai“' },
    { id: 'open', label: 'Visada matomi' },
  ] };
  // Admin parametras: įkėlimo animacija (visoms versijoms)
  const LOADER_PARAM = { key: 'loader', label: 'Įkėlimo animacija', type: 'radio', default: 'morph', options: [
    { id: 'morph', label: 'S susidėlioja iš taškų' },
    { id: 'wave', label: 'S banga' },
    { id: 'spark', label: 'Žvaigždutė (kaip buvo)' },
  ] };
  const DOTS_PARAM = { key: 'dots', label: 'Taškų skaičius S raidėje', type: 'radio', default: '7', options: [
    { id: '8', label: '8 taškai' }, { id: '7', label: '7 taškai' }, { id: '6', label: '6 taškai' }, { id: '5', label: '5 taškai' },
  ] };
  function search() {
    const store = {
      get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
      set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
    };
    return {
      S: window.SCENARIOS,
      R: window.RESULTS,
      scIdx: 0,
      step: 0,
      trail: [],
      query: '',
      own: '',
      other: false,
      tip: false,
      sideOpen: false,
      history: [],
      phase: 'start',    // start | loading | results
      busy: '',          // atsakymas, pagal kurį dabar tikslinam
      answered: [],      // { q, a } kiekvienam patikslinimo žingsniui
      flash: false,
      origQuery: '',     // ką žmogus įvedė pats
      suggestOpen: false,
      activeQuery: '',   // užklausa, su kuria padaryta dabartinė paieška
      vote: 0,
      rewriteFlash: false, // V4: klausimas lauke pasikeitė (trumpai paryškinam)
      pMode: 'item',     // panel'is: medžiaga (item) arba klausimas ekspertui (ask)
      ask: { q: '', sent: false, edit: false, me: { vardas: 'Laurynas', pavarde: 'Petrauskas', imone: 'UAB Įmonita', pareigos: 'Vyr. buhalteris', miestas: 'Vilnius', tel: '+370 600 00000' } },
      // ---------- Versijos ----------
      VERSIONS: [
        { id: 'v2', label: 'V2 · Dešinė kolona', desc: 'Vienas laukas, „Kita…“ atsakymas, dešinėje eiga, šaltiniai, istorija', params: [ANSWERS_PARAM, FILTERS_PARAM, LOADER_PARAM, DOTS_PARAM] },
        { id: 'v4', label: 'V4 · Kaip Google', desc: 'Susijusios paieškos tampa nauja paieška, grįžtama naršyklės Atgal. Tab\'ai: DI režimas · Viskas · Rezultatų sąrašas', params: [AI_STYLE_PARAM, FILTERS_PARAM, LOADER_PARAM, DOTS_PARAM] },
      ],
      ver: (() => {
        const q = new URLSearchParams(location.search).get('v');
        const v = q ? 'v' + q.replace(/^v/, '') : store.get('ai-paieska-ver');
        return ['v2', 'v4'].includes(v) ? v : 'v4';
      })(),
      p: {},             // aktyvios versijos admin parametrai
      fbOpen: false,
      get fbCollapsible() { return this.p.filters === 'collapsed' && !this.fbStack; },
      // V4 „Rezultatų sąrašas“: filtrai visada išskleisti, po rezultatų skaičiumi
      get fbStack() { return this.ver === 'v4' && this.mode === 'classic'; },
      get activeFilterCount() { return this.FKEYS.reduce((n, k) => n + this.vals(k).length, 0); },
      get verParams() { return (this.VERSIONS.find(v => v.id === this.ver) || {}).params || []; },
      setVer(v) {
        this.ver = v; store.set('ai-paieska-ver', v);
        const u = new URL(location.href); u.searchParams.set('v', v.slice(1)); history.replaceState(null, '', u);
        this.initParams(); this.other = false; this.closePanel();
        if (v !== 'v4') this.aiOnly = false;
        if (this.phase === 'results') { if (v === 'v4') this.query = this.activeQuery = this.queryFor(this.step); else this.query = this.activeQuery = this.origQuery; }
      },
      initParams() { this.p = Object.fromEntries(this.verParams.map(g => [g.key, g.default])); },

      mode: store.get('ai-paieska-mode') === 'classic' ? 'classic' : 'ai',
      aiOnly: false,     // V4 tab'as „Su AI“: tik AI atsakymas, be nuorodų
      get hideLinks() { return this.ver === 'v4' && this.mode === 'ai' && this.aiOnly; },
      panelOpen: false,
      adminOpen: false,
      pId: null,

      init() {
        this.initParams();
        this.loadScenario(0);
        this.query = this.activeQuery = this.origQuery = ''; this.phase = 'start';
        // Pavyzdinės ankstesnės paieškos
        this.history = [1, 2].map(i => ({ scIdx: i, query: this.S[i].query, step: 0, trail: [] }));
        this.deepLink();
        history.replaceState(this.snap(), '');
      },
      // ?s=<scenarijus>&step=<n>: atidaro rezultatus konkrečiame žingsnyje (ekranams ir nuorodoms)
      deepLink() {
        const q = new URLSearchParams(location.search), id = q.get('s');
        if (q.get('shot')) document.body.classList.add('is-shot');   // ekranams be Admin mygtuko
        const idx = this.S.findIndex(s => s.id === id);
        if (idx < 0) return;
        this.loadScenario(idx);
        const n = Math.min(+q.get('step') || 0, this.sc.steps.length - 1);
        for (let i = 0; i < n; i++) {
          const ai = this.sc.steps[this.step].ai;
          const label = ai.kind === 'directions' ? ai.directions[0].label : ai.chips[0];
          this.answered.push({ q: ai.kind === 'directions' ? ai.heading : ai.ask, a: label });
          this.trail.push(label); this.step++;
        }
        this.applyAi();
        if (this.ver === 'v4' && n) this.query = this.activeQuery = this.origQuery = this.queryFor(n);
      },

      get sc() { return this.S[this.scIdx]; },
      get ai() { return this.sc.steps[this.step].ai; },
      // Atsakymai į AI klausimą: kryptys (platus klausimas) arba chip'ai
      get answers() {
        if (this.ai.kind === 'directions') return this.ai.directions;
        return (this.ai.chips || []).map(label => ({ label }));
      },
      get related() { return this.ai.kind === 'empty' ? (this.ai.chips || []) : (this.sc.steps[this.step].related || []); },
      get suggestions() { return this.S.filter(s => !['nera', 'mazai'].includes(s.id)).map(s => s.query); },
      get showSuggest() { return this.phase === 'start' || !this.query.trim(); },
      get lastAnswer() {
        if (this.busy) return { q: this.askText || this.ai.heading, a: this.busy };
        if (this.step === 0) return null;
        return { ...this.answered[this.step - 1], from: this.sc.steps[this.step - 1].count, to: this.sc.steps[this.step].count };
      },
      get askText() { return this.ai.kind === 'directions' ? '' : this.ai.ask; },
      get steps() {
        return [{ label: this.origQuery || this.sc.query, count: this.sc.steps[0].count },
          ...this.trail.map((t, i) => ({ label: t, count: this.sc.steps[i + 1].count }))];
      },
      // V4: lauke rodomas klausimas pagal žingsnį
      queryFor(n) { return n === 0 ? this.origQuery : (this.sc.steps[n].rq || this.origQuery); },
      get sources() { return this.ai.kind === 'quotes' ? this.ai.quotes.map(q => q.id) : []; },
      get pastSearches() { return this.history.filter(h => h.scIdx !== this.scIdx).slice(0, 5); },
      get sideSummary() { if (this.ver === 'v4') return this.mode === 'ai' && this.sources.length ? `${this.sources.length} šaltiniai · Ankstesnės paieškos` : 'Ankstesnės paieškos'; return this.mode === 'ai' ? `Paieškos eiga · ${this.steps.length} žingsn. · ${this.sources.length} šaltiniai` : 'Ankstesnės paieškos'; },
      get countHtml() {
        const n = this.listCount;
        const from = this.mode === 'ai' && this.ver !== 'v4' && n !== this.sc.classicCount ? `<small>iš ${this.sc.classicCount}</small>` : '';
        const r = this.rezultatai(n), adj = { 'rezultatas': 'plikas', 'rezultatai': 'pliki', 'rezultatų': 'plikų' }[r];
        return `${n} ${adj} paieškos ${r}${from}`;
      },
      get shortQuery() { const q = this.sc.query; return q.length > 46 ? q.slice(0, 44) + '…' : q; },

      // Klasikinėje paieškoje testai iškyla į viršų (kaip dabar), AI režime eiliškumas pagal žingsnį
      get baseList() {
        if (this.mode === 'ai') return this.sc.steps[this.step].results;
        const all = [...new Set(this.sc.steps.flatMap(s => s.results))];
        return all.sort((a, b) => (this.R[b].type === 'Testas') - (this.R[a].type === 'Testas'));
      },
      get baseCount() { return this.mode === 'ai' ? this.sc.steps[this.step].count : this.sc.classicCount; },
      get list() {
        const l = this.baseList.filter(id => this.match(id));
        return this.sort === 'new' ? [...l].sort((a, b) => this.R[b].date.localeCompare(this.R[a].date)) : l;
      },
      // Jei žmogus pats pridėjo filtrą, rodom tikrą skaičių; AI filtrai jau įskaičiuoti žingsnio skaičiuje
      get listCount() { return this.userFilter ? this.list.length * this.scale : this.baseCount; },
      rezultatai(n) { const d = n % 10, t = n % 100; return d === 0 || (t > 10 && t < 20) ? 'rezultatų' : d === 1 ? 'rezultatas' : 'rezultatai'; },

      // ---------- Filtrai ----------
      F: window.FILTERS,
      FKEYS: ['rub', 'tema', 'data', 'fmt'],
      f: { rub: [], tema: [], fmt: [], data: '' },
      aiF: [],           // AI pritaikyti filtrai: 'tema:Komandiruotės'
      pop: '',
      popQ: '',
      sort: 'rel',
      get anyFilter() { return this.FKEYS.some(k => this.has(k)); },
      get userFilter() { return this.FKEYS.some(k => this.vals(k).some(v => !this.aiF.includes(k + ':' + v))); },
      get scale() { return Math.max(1, Math.round(this.baseCount / Math.max(1, this.baseList.length))); },
      vals(k) { return this.F[k].single ? (this.f[k] ? [this.f[k]] : []) : this.f[k]; },
      has(k) { return this.vals(k).length > 0; },
      isOn(k, v) { return this.vals(k).includes(v); },
      isAi(k) { return this.vals(k).some(v => this.aiF.includes(k + ':' + v)); },
      optLabel(k, v) { return this.F[k].single ? this.F[k].options.find(o => o.id === v).label : v; },
      pillText(k) {
        const v = this.vals(k);
        if (!v.length) return this.F[k].label;
        return `${this.F[k].label}: <b>${this.optLabel(k, v[0])}</b>` + (v.length > 1 ? ` <span class="is-more">+${v.length - 1}</span>` : '');
      },
      popOptions(k) {
        const q = this.popQ.trim().toLowerCase();
        const opts = this.F[k].options.map(o => typeof o === 'string' ? { id: o, label: o } : o);
        const hit = opts.filter(o => !q || o.label.toLowerCase().includes(q));
        return this.F[k].single ? hit : [...hit.filter(o => this.isOn(k, o.id)), ...hit.filter(o => !this.isOn(k, o.id))];
      },
      matchKey(id, k, v) {
        const r = this.R[id];
        if (k !== 'data') return r[k] === v;
        const o = this.F.data.options.find(x => x.id === v);
        return (!o.from || r.date >= o.from) && (!o.to || r.date <= o.to);
      },
      match(id, skip) { return this.FKEYS.every(k => k === skip || !this.has(k) || this.vals(k).some(v => this.matchKey(id, k, v))); },
      optCount(k, v) { return this.baseList.filter(id => this.match(id, k) && this.matchKey(id, k, v)).length * this.scale; },
      togglePop(k) { this.pop = this.pop === k ? '' : k; this.popQ = ''; },
      toggle(k, v) {
        this.aiF = this.aiF.filter(x => x !== k + ':' + v);
        if (this.F[k].single) { this.f[k] = this.f[k] === v ? '' : v; this.pop = ''; return; }
        this.f[k] = this.isOn(k, v) ? this.f[k].filter(x => x !== v) : [...this.f[k], v];
      },
      clearKey(k) { this.f[k] = this.F[k].single ? '' : []; this.aiF = this.aiF.filter(x => !x.startsWith(k + ':')); this.pop = ''; },
      clearAll() { this.FKEYS.forEach(k => this.clearKey(k)); },
      // Perjungiant žingsnį AI filtrai pakeičiami naujais, žmogaus pasirinkti lieka
      applyAi() {
        this.aiF.forEach(x => { const [k, v] = x.split(':'); if (this.F[k].single) { if (this.f[k] === v) this.f[k] = ''; } else this.f[k] = this.f[k].filter(y => y !== v); });
        this.aiF = [];
        const sf = this.mode === 'ai' ? (this.sc.steps[this.step].filters || {}) : {};
        Object.entries(sf).forEach(([k, v]) => {
          [].concat(v).forEach(val => {
            if (this.isOn(k, val)) return;
            if (this.F[k].single) this.f[k] = val; else this.f[k] = [...this.f[k], val];
            this.aiF.push(k + ':' + val);
          });
        });
      },
      get countChain() {
        const n = [this.sc.classicCount, ...this.sc.steps.slice(0, this.step + 1).map(s => s.count)];
        const uniq = n.filter((v, i) => i === 0 || v !== n[i - 1]);
        return uniq.map((v, i) => i === uniq.length - 1 ? `<b>${v}</b>` : v).join(' → ') + ' rezultatų';
      },

      resetDemo() { this.setMode('ai'); history.replaceState({ ph: 'start' }, ''); this.initParams(); this.loadScenario(0); this.phase = 'start'; this.query = this.activeQuery = this.origQuery = ''; this.adminOpen = false; window.scrollTo({ top: 0, behavior: 'smooth' }); },
      // Logotipas: grįžtam į pradinį puslapį (dar neieškota)
      goHome() {
        if (this.phase === 'start') return;
        if (this.phase === 'results') this.remember();
        clearTimeout(this._t); this.pvClose();
        this.loadScenario(0); this.phase = 'start'; this.query = this.activeQuery = this.origQuery = '';
        if (this.ver === 'v4') history.pushState({ ph: 'start' }, '');
        window.scrollTo({ top: 0, behavior: 'smooth' });
      },
      setMode(m, aiOnly = false) { this.mode = m; this.aiOnly = aiOnly; store.set('ai-paieska-mode', m); this.applyAi(); },
      loadScenario(i) {
        this.scIdx = i; this.step = 0; this.trail = []; this.vote = 0; this.own = '';
        this.query = this.activeQuery = this.origQuery = this.sc.query; this.closePanel(); this.other = false;
        this.answered = []; this.busy = ''; this.phase = 'results'; this.fbOpen = false;

        this.f = { rub: [], tema: [], fmt: [], data: '' }; this.aiF = []; this.sort = 'rel'; this.applyAi();
      },
      // Pakeitus tekstą viršuje prasideda nauja paieška; senoji nukeliauja į „Ankstesnes paieškas“
      submitSearch() {
        const typed = this.query.trim();
        if (!typed || (typed === this.activeQuery && this.phase === 'results')) return;
        const wasResults = this.phase === 'results';
        const q = typed.toLowerCase();
        const rules = [[/tort|gimtadien|dovan|reprezent/, 'mazai'], [/šeštad|savaitg|laisv|poilsio/, 'savaitgalis'], [/komandir|dienpinig/, 'komandiruote'], [/pvm/, 'pvm']];
        const hit = rules.find(([re]) => re.test(q));
        const idx = this.S.findIndex(s => s.id === (hit ? hit[1] : 'nera'));
        if (wasResults) this.remember();
        this.loadScenario(idx);
        this.query = this.activeQuery = this.origQuery = typed;
        this.phase = 'loading'; window.scrollTo({ top: 0 });
        clearTimeout(this._t); this._t = setTimeout(() => { this.phase = 'results'; }, 1800);
        this.push();
      },
      // ---------- V4: kaip Google. Susijusi paieška = nauja paieška, Atgal per naršyklę ----------
      snap() { return this.phase === 'start' ? { ph: 'start' } : { sc: this.scIdx, step: this.step, q: this.activeQuery }; },
      push() { if (this.ver === 'v4') history.pushState(this.snap(), ''); },
      follow(q) {
        if (this.ai.kind === 'empty') { this.query = q; this.submitSearch(); return; }
        if (this.step >= this.sc.steps.length - 1) return;
        this.closePanel(); this.pvClose();
        this.step++; this.trail = [...this.trail.slice(0, this.step - 1), q]; this.vote = 0; this.applyAi();
        this.query = this.activeQuery = this.origQuery = q;
        this.rewriteFlash = false; this.$nextTick(() => { this.rewriteFlash = true; clearTimeout(this._rw); this._rw = setTimeout(() => { this.rewriteFlash = false; }, 1500); });
        this.phase = 'loading'; window.scrollTo({ top: 0 });
        clearTimeout(this._t); this._t = setTimeout(() => { this.phase = 'results'; }, 1800);
        this.push();
      },
      onPop(e) {
        const s = e.state;
        if (this.ver !== 'v4' || !s) return;
        clearTimeout(this._t); this.closePanel(); this.pvClose();
        if (s.ph === 'start') { this.loadScenario(0); this.phase = 'start'; this.query = this.activeQuery = this.origQuery = ''; return; }
        this.loadScenario(s.sc);
        this.step = s.step; this.trail = this.trail.slice(0, s.step); this.applyAi();
        this.query = this.activeQuery = this.origQuery = s.q;
        window.scrollTo({ top: 0 });
      },
      remember() {
        const h = { scIdx: this.scIdx, query: this.origQuery, step: this.step, trail: [...this.trail], answered: [...this.answered] };
        this.history = [h, ...this.history.filter(x => x.scIdx !== h.scIdx)].slice(0, 6);
      },
      restore(h) {
        this.remember();
        this.loadScenario(h.scIdx);
        this.query = this.activeQuery = this.origQuery = h.query; this.step = h.step; this.trail = [...h.trail]; this.answered = (h.answered || []).slice(); this.applyAi(); this.push();
      },
      openOther() { this.other = true; setTimeout(() => this.$refs.other && this.$refs.other.focus(), 60); },
      refine(label) {
        label = (label || '').trim();
        if (!label) return;
        // „Nėra rezultatų“ atveju pasiūlymai veikia kaip nauja paieška
        if (this.ai.kind === 'empty') { this.query = label; this.submitSearch(); return; }
        if (this.step >= this.sc.steps.length - 1) { this.own = ''; this.other = false; return; }
        if (this.busy) return;
        const answer = { q: this.askText || this.ai.heading, a: label };
        const apply = () => {
          this.trail = [...this.trail.slice(0, this.step), label];
          this.answered = [...this.answered.slice(0, this.step), answer];
          this.step++; this.own = ''; this.other = false; this.vote = 0; this.busy = ''; this.applyAi();
         
          this.flash = true; clearTimeout(this._f); this._f = setTimeout(() => { this.flash = false; }, 1600);
        };
        this.busy = label; this.other = false; this.toTop();
        clearTimeout(this._t); this._t = setTimeout(apply, 1700);
      },
      goStep(n) { if (this.busy) return; this.other = false; this.step = n; this.trail = this.trail.slice(0, n); this.answered = this.answered.slice(0, n); this.vote = 0; this.applyAi(); this.toTop(); },
      // Jei naudotojas nuslinko žemiau, grąžinam prie žingsnių juostos
      toTop() { this.$nextTick(() => { const el = document.querySelector('.sr-modes'); if (el && el.getBoundingClientRect().top < 0) el.scrollIntoView({ behavior: 'smooth' }); }); },

      // ---------- Panel ----------
      get pIndex() { return this.list.indexOf(this.pId); },
      get panelPos() { const i = this.pIndex; return i < 0 ? '' : `${i + 1} iš ${this.list.length}`; },
      openPanel(id, toCite = false) {
        this.pMode = 'item'; this.pId = id; this.panelOpen = true;
        this.$nextTick(() => {
          const body = this.$refs.pnBody; if (!body) return;
          const cite = body.querySelector('.pn-cite');
          if (toCite && cite) {
            setTimeout(() => {
              body.scrollTo({ top: cite.offsetTop - 80, behavior: 'smooth' });
              cite.classList.remove('is-flash'); void cite.offsetWidth; cite.classList.add('is-flash');
            }, 260);
          } else body.scrollTop = 0;
        });
      },
      panelStep(d) { const id = this.list[this.pIndex + d]; if (id) this.openPanel(id); },
      closePanel() { this.panelOpen = false; },
      // Klausimas ekspertui: atidarom panel'į su jau įrašytu paieškos klausimu
      openAsk() {
        this.pvClose();
        if (!this.ask.sent || this.ask.q !== this.activeQuery) this.ask = { ...this.ask, q: this.activeQuery, sent: false, edit: false };
        this.pMode = 'ask'; this.panelOpen = true;
        this.$nextTick(() => setTimeout(() => { const t = this.$refs.askQ; if (t) { t.focus(); t.setSelectionRange(t.value.length, t.value.length); } }, 320));
      },
      askAdd(label) {
        const key = label.split(' (')[0];
        this.ask.q = this.ask.q.replace(/\s+$/, '') + '\n' + key + ': ';
        this.$nextTick(() => { const t = this.$refs.askQ; if (t) { t.focus(); t.setSelectionRange(t.value.length, t.value.length); } });
      },
      get askSuggest() { return this.ai.kind === 'low' ? this.sc.steps[this.step].results.slice(0, 2) : []; },

      // ---------- Greita peržiūra ----------
      pv: { id: null, x: 0, y: 0, place: 'below' },
      pvEnter(id, el) {
        if (!window.matchMedia('(hover: hover)').matches || this.panelOpen) return;
        clearTimeout(this._pvOut); clearTimeout(this._pvIn);
        this._pvIn = setTimeout(() => {
          const r = el.getBoundingClientRect(), W = 380, Hh = 360, gap = 8;
          const below = r.bottom + gap + Hh < innerHeight || r.top < Hh + gap;
          this.pv = {
            id,
            x: Math.max(12, Math.min(r.left, innerWidth - W - 12)),
            y: below ? r.bottom + gap : r.top - gap - Hh,
            place: below ? 'below' : 'above',
          };
          // Kortelėje iškart matosi citata
          this.$nextTick(() => setTimeout(() => {
            const b = this.$refs.pvBody, c = b && b.querySelector('.pv-cite');
            if (b && c) b.scrollTop = c.offsetTop - 12;
          }, 30));
        }, this.pv.id ? 120 : 400);
      },
      pvLeave() { clearTimeout(this._pvIn); this._pvOut = setTimeout(() => this.pvClose(), 220); },
      pvKeep() { clearTimeout(this._pvOut); },
      pvClose() { clearTimeout(this._pvIn); clearTimeout(this._pvOut); this.pv = { ...this.pv, id: null }; },
    };
  }
</script>
</body>
