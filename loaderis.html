<!doctype html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>AI paieška: įkėlimo animacija</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/loader-ai.css">
<style>
  :root { --ink: #2f4347; --sub: #5f7a7e; --line: #e3ecec; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 48px 16px; font-family: 'Open Sans', system-ui, sans-serif; color: var(--ink); background: #fff; }
  main { max-width: 860px; margin: 0 auto; }
  h1 { margin: 0 0 6px; font-size: 22px; }
  p.lead { margin: 0 0 28px; color: var(--sub); line-height: 1.6; }
  .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
  .card { display: grid; gap: 18px; justify-items: center; padding: 28px 16px 20px; border: 1px solid var(--line); border-radius: 14px; }
  .card.is-rec { border-color: #99cccc; background: #f6fafa; }
  .card h2 { margin: 0; font-size: 14px; font-weight: 600; text-align: center; }
  .card small { color: var(--sub); font-size: 12.5px; text-align: center; line-height: 1.5; }
  .inline { display: flex; align-items: center; gap: 6px; color: var(--sub); font-size: 14px; }
  @media (max-width: 640px) { .grid { grid-template-columns: minmax(0, 1fr); } }
</style>
</head>
<body>
<main>
  <h1>Įkėlimo animacija</h1>
  <p class="lead">Kol DI ieško atsakymo, animuojasi pati DI ikona. Kortelėje viršuje padidinta, apačioje tikru dydžiu, kaip prototipe. Prototipe perjungiama per Admin → Įkėlimo animacija.</p>
  <div class="grid" id="ai"></div>
</main>
<script src="assets/js/loader.js"></script>
<script>
  const items = [
    ['ai-dots', 'Taškai susirenka į DI žvaigždę', 'Žiedas virsta žvaigžde', false],
    ['ai-draw', 'DI žvaigždė nusipiešia', 'Numatytoji', true],
    ['ai-pulse', 'DI žvaigždė kvėpuoja su kometomis', 'Ramiausia', false],
  ];
  document.getElementById('ai').innerHTML = items.map(([k, t, note, rec]) => `
    <div class="card${rec ? ' is-rec' : ''}">
      ${LOADER(k, 72)}
      <h2>${t}</h2>
      <small>${note}</small>
      <div class="inline">${LOADER(k, 21)} Ieškom SUFLERIO medžiagoje…</div>
    </div>`).join('');
</script>
</body>
</html>
